# Configuration du journal Kindle.
# Modifiez ce fichier pour changer les sources, les rubriques, les quotas
# ou la ligne éditoriale. L'agent de la routine le lit à chaque fabrication.

titre: "Le Journal"
sous_titre: "Revue de presse du matin"
fuseau: Europe/Paris

# Nombre d'articles visé dans l'édition (l'agent peut s'en écarter d'un ou deux).
articles_par_jour: 8
# Nombre d'articles minimum et maximum par rubrique retenue.
quota_par_rubrique:
  min: 1
  max: 3

# Longueur maximale du texte d'un article, en caractères (coupé à la fin d'un
# paragraphe au-delà, avec un renvoi vers l'article en ligne).
longueur_max_article: 3500

# Collecte : un article plus ancien que ce délai est ignoré.
max_age_heures: 30
# Nombre maximal d'articles gardés par flux lors de la collecte.
max_par_flux: 15
# Nombre d'éditions conservées dans editions/ (les plus anciennes sont supprimées).
editions_conservees: 30

# Consignes pour le tri et la rédaction. Écrites pour l'agent qui compose l'édition.
ligne_editoriale: |
  Journal d'actualité générale française, lu le matin sur une liseuse, en
  une vingtaine de minutes : huit articles environ, jamais plus de dix.
  - Retenir ce qui aide à comprendre l'actualité : analyses, enquêtes,
    reportages, explications de fond, portraits. Écarter les dépêches brutes,
    les « en direct », les brèves de quelques lignes, les sujets people,
    les résultats sportifs et les contenus promotionnels.
  - Un même événement n'apparaît qu'une fois : garder la version la plus
    complète ou la mieux écrite, même si plusieurs sources le traitent.
  - Chercher l'équilibre entre les rubriques (international, France,
    économie, société, sciences et environnement, culture). Pas plus de
    trois articles dans une rubrique, aucune rubrique n'est obligatoire.
  - Varier les sources : ne pas composer l'édition avec un seul titre.
  - Les titres sont réécrits en français, informatifs et sobres, sans
    point d'exclamation ni suspense artificiel, 90 caractères au plus.
  - Le chapeau fait exactement deux phrases : la première dit le fait,
    la seconde dit pourquoi il compte ou ce qu'il faut en retenir.
    Il est écrit à partir du résumé fourni, sans inventer de détail.
  - L'éditorial d'ouverture (facultatif) fait trois phrases au plus et
    présente le fil de la journée.

# Rubriques dans l'ordre d'apparition dans le journal.
rubriques:
  - À la une
  - International
  - France
  - Économie
  - Société
  - Planète et sciences
  - Culture et idées

# Exclusions appliquées à la collecte (expressions régulières, casse ignorée).
exclusions:
  titres:
    - "^en direct"
    - "^direct\\b"
    - "\\blive\\b"
    - "horoscope"
    - "\\b(loto|euromillions)\\b"
    - "programme tv"
    - "^(podcast|vidéo|video|diaporama|quiz|jeu concours)\\b"
    - "^revue de presse"
    - "^le résumé de la nuit"
    - "^(athlétisme|tennis|football|rugby|cyclisme|formule 1|ligue 1|basket|handball|natation|golf|boxe|mma|judo|ski)\\b"
  liens:
    - "/live/"
    - "/direct/"
    - "/video/"
    - "/videos/"
    - "/podcast"
    - "/sport/"
    - "/sports/"
    - "/football/"
    - "/rugby/"
    - "/tennis/"

# Flux RSS. « rubrique » est le classement proposé par défaut ; l'agent peut
